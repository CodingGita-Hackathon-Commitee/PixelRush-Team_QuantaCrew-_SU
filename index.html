<!DOCTYPE html>
<html>
<head>
    <title>PawPal Login</title>
    <link rel="stylesheet" href="style.css">
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px 60px;
    font-family: Arial, sans-serif;
    background: #fff7fb;
    color: #302035;
}

/* TOP */

.top {
    width: 900px;
    margin: auto;
    background: #e9e6e8;
    padding: 12px;
    border-radius: 50px;
    display: flex;
    justify-content: space-around;
}

.top a {
    text-decoration: none;
    color: #4d4147;
    font-size: 20px;
    font-weight: bold;
    padding: 18px 70px;
    border-radius: 40px;
}

.top a:first-child {
    background: white;
    color: #ff5785;
}

/* HEADER */

.head {
    max-width: 1100px;
    margin: 25px auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.head b {
    font-size: 35px;
}

.head span {
    color: #ff5785;
}

.head a {
    text-decoration: none;
    background: white;
    color: #4d4147;
    border-radius: 50%;
    padding: 12px 18px;
    font-size: 25px;
}

/* MAIN */

main {
    width: 650px;
    margin: auto;
    text-align: center;
}

/* DOG */

.dog {
    width: 180px;
    height: 180px;
    margin: 20px auto 0;
    border: 8px solid white;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 0 15px #ff5785;
}

.dog img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.ready {
    width: 270px;
    margin: -5px auto 25px;
    padding: 12px;
    background: white;
    border-radius: 30px;
    color: #b52c60;
    font-size: 20px;
    font-weight: bold;
    box-shadow: 0 5px 10px #ddd;
}

/* TEXT */

h1 {
    font-size: 45px;
    margin: 20px 0 10px;
}

.sub {
    font-size: 20px;
    color: #62545b;
}

/* FORM */

form {
    margin-top: 35px;
    text-align: left;
}

form > label {
    display: block;
    font-size: 20px;
    margin: 20px 15px 8px;
}

input[type="text"],
input[type="password"] {
    width: 100%;
    padding: 20px;
    border: 0;
    border-radius: 40px;
    font-size: 18px;
    background: white;
    box-shadow: 0 2px 5px #ddd;
}

/* ROW */

.row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 22px 15px;
    font-size: 17px;
}

.row a {
    color: #b52c60;
    text-decoration: none;
    font-weight: bold;
}

.remember {
    display: flex;
    align-items: center;
    gap: 8px;
}

.remember input {
    width: 18px;
    height: 18px;
}

/* LOGIN */

.btn {
    display: block;
    text-align: center;
    text-decoration: none;
    background: #ff5785;
    color: white;
    padding: 20px;
    border-radius: 40px;
    font-size: 25px;
    margin-top: 25px;
}

/* SOCIAL */

.or {
    color: #8d7e85;
    font-size: 17px;
    margin: 35px 0 20px;
}

.social {
    display: flex;
    gap: 15px;
}

.social a {
    flex: 1;
    background: white;
    padding: 18px;
    border-radius: 40px;
    text-decoration: none;
    color: #302035;
    font-size: 17px;
    box-shadow: 0 2px 5px #ddd;
}

/* SIGN UP */

.signup,
.doctor {
    display: block;
    width: 80%;
    margin: 30px auto 0;
    padding: 18px;
    background: white;
    border-radius: 40px;
    text-align: center;
    text-decoration: none;
    color: #62545b;
    font-size: 18px;
    box-shadow: 0 2px 5px #ddd;
}

.signup b,
.doctor b {
    color: #b52c60;
}

.doctor {
    width: 55%;
    margin-top: 20px;
}

</style>
</head>

<body>

    <div class="top">
        <a href="index.html">Pet Parent 🐾</a>
        <a href="1_clinic.html">Clinic & Vet 🩺</a>
    </div>

    <div class="head">
        <b>PawPal<span>●</span></b>
        <a href="help.html">?</a>
    </div>

    <main>

        <div class="dog">
            <img src="dog.png" alt="Pet">
        </div>

        <div class="ready">♥ Ready for treats!</div>

        <h1>Welcome Back!</h1>

        <p class="sub">Log in to care for your furry best buddy 🐾</p>

        <form>

            <label>Email or Mobile</label>
            <input type="text"
                   placeholder="hello@pawpal.pet or (555) 000-0000">

            <label>Password</label>
            <input type="password"
                   placeholder="Enter your secret paw-sword">

            <div class="row">
                <label class="remember">
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="forgot.html">Forgot Password?</a>
            </div>

            <a class="btn" href="5_home.html">Log In 🐾</a>

        </form>

        <p class="or">OR SIGN IN WITH</p>

        <div class="social">
            <a href="google.html">🌈 Google</a>
            <a href="apple.html">● Apple</a>
            <a href="sms.html">▣ SMS</a>
        </div>

        <a class="signup" href="3_signup.html">
            Don't have an account? <b>Sign Up</b>
        </a>

        <a class="doctor" href="1_clinic.html">
            IF DOCTOR, <b>Click Here</b>
        </a>

    </main>

</body>
</html>
